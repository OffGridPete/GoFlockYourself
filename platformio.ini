; =============================================================================
; GoFlockYourself — ESP32-2432S028R (Cheap Yellow Display / CYD)
; Passive Flock Safety camera detector
; =============================================================================
; Flash:  pio run -e cyd -t upload
; Monitor: pio device monitor -b 115200
;
; Arduino-ESP32 2.0.17 (espressif32 6.x). Do not leave this unpinned — an
; unpinned `espressif32` can resolve to pioarduino Arduino 3.x, which breaks
; TFT_eSPI (SPIFFS.h) and NimBLE-Arduino 1.4.3.
; =============================================================================

[env:cyd]
platform = espressif32 @ 6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio

lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
  h2zero/NimBLE-Arduino @ ^1.4.3

build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DBOARD_HAS_PSRAM=0
  -DUSER_SETUP_LOADED=1
  -DILI9341_2_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_FONT8=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
  ; Optional: disable BLE to reclaim flash/RAM (set 0)
  -DGFY_ENABLE_BLE=1

monitor_filters = esp32_exception_decoder
