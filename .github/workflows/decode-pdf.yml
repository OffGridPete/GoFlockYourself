name: Decode documentation PDF

on:
  push:
    paths:
      - "docs/GoFlockYourself_Technical_Documentation.pdf.b64"
      - ".github/workflows/decode-pdf.yml"

jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode PDF and commit
        run: |
          set -euo pipefail
          if [ ! -f docs/GoFlockYourself_Technical_Documentation.pdf.b64 ]; then
            echo "No PDF payload; nothing to do"
            exit 0
          fi
          base64 -d docs/GoFlockYourself_Technical_Documentation.pdf.b64 > docs/GoFlockYourself_Technical_Documentation.pdf
          python3 - <<'PY'
          from pathlib import Path
          data = Path("docs/GoFlockYourself_Technical_Documentation.pdf").read_bytes()
          assert data.startswith(b"%PDF"), data[:16]
          print(f"decoded {len(data)} bytes")
          PY
          rm docs/GoFlockYourself_Technical_Documentation.pdf.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GoFlockYourself_Technical_Documentation.pdf docs/GoFlockYourself_Technical_Documentation.pdf.b64
          git commit -m "Add documentation PDF"
          git push
